x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

services:

  # ==========================================
  # MICROSERVICES (Auth Service)
  # ==========================================
  auth-service:
    image: ghcr.io/advprog-2026-a18-project/autentikasi-autorisasi-manajemen-pengguna:latest 
    container_name: sawit-auth-service
    environment:
      - SERVER_PORT=8081
      - SPRING_PROFILES_ACTIVE=prod
      - SPRING_DATASOURCE_URL=${AUTH_DB_URL}
      - SPRING_DATASOURCE_USERNAME=${AUTH_DB_USER}
      - SPRING_DATASOURCE_PASSWORD=${AUTH_DB_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - ADMIN_USERNAME=${ADMIN_USERNAME}
      - ADMIN_EMAIL=${ADMIN_EMAIL}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - ADMIN_FULLNAME=${ADMIN_FULLNAME}
      - GRPC_PORT=9091
    expose:
      - "8081"
      - "9091"
    networks:
      - sawit-network
    restart: unless-stopped
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 8081 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 180s
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

  # ==========================================
  # MICROSERVICES (Pembayaran Service)
  # ==========================================
  pembayaran-service:
    image: ghcr.io/advprog-2026-a18-project/manajemen-pembayaran:latest 
    container_name: sawit-pembayaran-service
    environment:
      - SERVER_PORT=8085 
      - SPRING_PROFILES_ACTIVE=prod
      - SPRING_DATASOURCE_URL=${PEMBAYARAN_DB_URL}
      - SPRING_DATASOURCE_USERNAME=${PEMBAYARAN_DB_USER}
      - SPRING_DATASOURCE_PASSWORD=${PEMBAYARAN_DB_PASSWORD}
      - JWT_SECRET=${JWT_SECRET} 
      - GRPC_ENABLED=true
      - GRPC_PORT=9095
    expose:
      - "8085"
      - "9095"
    networks:
      - sawit-network
    restart: unless-stopped
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 8085 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 120s
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

  # ==========================================
  # MICROSERVICES (Manajemen Kebun Sawit Service)
  # ==========================================
  manajemen-kebun-sawit-service:
    image: ghcr.io/advprog-2026-a18-project/mysawit-manajemen-kebun-sawit:latest 
    container_name: sawit-manajemen-kebun-sawit-service
    environment:
      - SERVER_PORT=8082 
      - SPRING_PROFILES_ACTIVE=prod
      - SPRING_DATASOURCE_URL=${M_KEBUN_SAWIT_DB_URL}
      - SPRING_DATASOURCE_USERNAME=${M_KEBUN_SAWIT_DB_USER}
      - SPRING_DATASOURCE_PASSWORD=${M_KEBUN_SAWIT_DB_PASSWORD}
      - JWT_SECRET=${JWT_SECRET} 
      - GRPC_PORT=9092
      - AUTH_GRPC_ENABLED=true
      - AUTH_GRPC_HOST=auth-service
      - AUTH_GRPC_PORT=9091
    expose:
      - "8082"
      - "9092"
    depends_on:
      auth-service:
        condition: service_healthy
    networks:
      - sawit-network
    restart: unless-stopped
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 8082 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 120s
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
  
  # ==========================================
  # MICROSERVICES (Pengiriman Hasil Panen Sawit Service)
  # ==========================================
  pengiriman-hasil-panen-sawit-service:
    image: ghcr.io/advprog-2026-a18-project/pengiriman-hasil-panen-sawit:latest 
    container_name: sawit-pengiriman-hasil-panen-service
    environment:
      - SERVER_PORT=8084 
      - SPRING_PROFILES_ACTIVE=prod
      - SPRING_DATASOURCE_URL=${HASIL_DB_URL}
      - SPRING_DATASOURCE_USERNAME=${HASIL_DB_USER}
      - SPRING_DATASOURCE_PASSWORD=${HASIL_DB_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}
      - INTERNAL_GRPC_ENABLED=true
      - AUTH_GRPC_HOST=auth-service
      - AUTH_GRPC_PORT=9091
      - KEBUN_GRPC_HOST=manajemen-kebun-sawit-service
      - KEBUN_GRPC_PORT=9092
      - PANEN_GRPC_HOST=manajemen-hasil-panen-sawit-service
      - PANEN_GRPC_PORT=9093
      - PAYMENT_GRPC_HOST=pembayaran-service
      - PAYMENT_GRPC_PORT=9095
    expose:
      - "8084"
    depends_on:
      auth-service:
        condition: service_healthy
      manajemen-kebun-sawit-service:
        condition: service_healthy
      manajemen-hasil-panen-sawit-service:
        condition: service_healthy
      pembayaran-service:
        condition: service_healthy
    networks:
      - sawit-network
    restart: unless-stopped
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 8084 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 120s
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
  
  # ==========================================
  # MICROSERVICES (Manajemen Hasil Panen Sawit Service)
  # ==========================================
  manajemen-hasil-panen-sawit-service:
    image: ghcr.io/advprog-2026-a18-project/manajemen-hasil-panen-sawit:latest 
    container_name: sawit-manajemen-hasil-panen-service
    environment:
      - SERVER_PORT=8083 
      - SPRING_PROFILES_ACTIVE=prod
      - DB_HOST=${M_HASIL_DB_HOST}
      - DB_NAME=${M_HASIL_DB_NAME}
      - DB_USER=${M_HASIL_DB_USER}
      - DB_PASS=${M_HASIL_DB_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}
      - GRPC_PORT=9093
      - AUTH_GRPC_ENABLED=true
      - AUTH_GRPC_HOST=auth-service
      - AUTH_GRPC_PORT=9091
      - PAYMENT_GRPC_ENABLED=true
      - PAYMENT_GRPC_HOST=pembayaran-service
      - PAYMENT_GRPC_PORT=9095
    expose:
      - "8083"
      - "9093"
    depends_on:
      auth-service:
        condition: service_healthy
      pembayaran-service:
        condition: service_healthy
    networks:
      - sawit-network
    restart: unless-stopped
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 8083 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 120s
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
  
  # ==========================================
  # API GATEWAY
  # ==========================================
  api-gateway:
    image: ghcr.io/advprog-2026-a18-project/api-sawit-gateway:latest
    container_name: sawit-api-gateway
    ports:
      - "8080:8080" 
    depends_on:
      auth-service:
        condition: service_healthy
      manajemen-kebun-sawit-service:
        condition: service_healthy
      manajemen-hasil-panen-sawit-service:
        condition: service_healthy
      pengiriman-hasil-panen-sawit-service:
        condition: service_healthy
      pembayaran-service:
        condition: service_healthy
    environment:
      - SERVER_PORT=8080
      - JWT_SECRET=${JWT_SECRET}
    networks:
      - sawit-network
    restart: unless-stopped
    logging: *default-logging
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

  # ==========================================
  # WATCHTOWER 
  # ==========================================
  watchtower:
    image: containrrr/watchtower
    container_name: sawit-watchtower
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    command: --interval 60 --label-enable --cleanup
    restart: unless-stopped
    logging: *default-logging

networks:
  sawit-network:
    driver: bridge
